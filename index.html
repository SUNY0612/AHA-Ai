<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f0">
    <title>AHA | 이해하는 수학</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="AHA 홈">AHA<span>.</span></a>
      <p class="tagline">답을 넘어, 이해하는 순간.</p>
      <span class="edition">MATH · 01</span>
    </header>

    <main class="workspace">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span class="eyebrow-dot"></span> YOUR STUDY SPACE</div>
        <h1 id="page-title">수학 문제를<br><span>입력해 주세요.</span></h1>
        <p class="intro-copy">막히는 순간부터 시작해도 괜찮아요.<br>차근차근 함께 풀어볼게요.</p>
      </section>

      <section class="solver" aria-label="수학 문제 풀이">
        <form id="solve-form">
          <label class="field-label" for="problem">오늘의 문제 <span>MATHEMATICS</span></label>
          <textarea id="problem" name="problem" rows="5" maxlength="4000" placeholder="예: x² - 5x + 6 = 0&#10;&#10;문제의 조건과 질문을 함께 적어주세요." required></textarea>
          <div class="form-bottom">
            <p class="input-hint">수식과 풀이가 필요한 부분을 자유롭게 적어주세요.</p>
            <button id="solve-button" type="submit">
              <span class="button-label">풀이 시작</span>
              <span class="button-arrow" aria-hidden="true">↗</span>
            </button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite" hidden></p>

        <section id="result" class="result" aria-labelledby="result-title" hidden>
          <div class="result-heading">
            <div>
              <p class="result-kicker">AHA SOLUTION</p>
              <h2 id="result-title">한 걸음씩 풀어볼게요.</h2>
            </div>
            <span class="result-mark" aria-hidden="true">A</span>
          </div>
          <div class="result-problem">
            <span class="result-label">QUESTION</span>
            <p id="result-problem-text"></p>
          </div>
          <div class="solution-block">
            <span class="result-label">SOLUTION</span>
            <p id="solution-text" class="solution-text"></p>
          </div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <span>AHA MATH</span>
      <span>작은 이해가 쌓여, 큰 자신감으로.</span>
    </footer>
  </body>
</html>
