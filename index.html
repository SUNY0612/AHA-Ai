<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf3ed">
    <title>AHA | 같이 푸는 수학</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="home-page">
    <header class="home-header">
      <a class="wordmark" href="/" aria-label="AHA 홈">AHA<span>.</span></a>
      <span class="header-note">YOUR FRIEND IN MATH</span>
    </header>

    <main class="home-hero">
      <div class="home-copy">
        <p class="eyebrow"><span class="eyebrow-dot"></span> AHA STUDY CLUB</p>
        <h1>막힌 문제<br><span>같이 풀어봐요</span></h1>
        <p class="home-description">모르는 문제 앞에서 혼자 고민하지 마.<br>아하랑 편하게 하나씩 풀어보자.</p>
        <a class="primary-link" href="/solve">
          <span>문제 풀러가기</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="home-art" aria-label="수학 코치 아하 캐릭터">
        <span class="doodle doodle-one" aria-hidden="true">x² + y²</span>
        <span class="doodle doodle-two" aria-hidden="true">✳</span>
        <span class="doodle doodle-three" aria-hidden="true">∑</span>
        <div class="mascot mascot--large" aria-hidden="true">
          <span class="mascot-antenna"></span>
          <span class="mascot-face">
            <span class="mascot-eye mascot-eye-left"></span>
            <span class="mascot-eye mascot-eye-right"></span>
            <span class="mascot-cheek mascot-cheek-left"></span>
            <span class="mascot-cheek mascot-cheek-right"></span>
            <span class="mascot-mouth"></span>
          </span>
          <span class="mascot-body"><span></span></span>
          <span class="mascot-arm mascot-arm-left"></span>
          <span class="mascot-arm mascot-arm-right"></span>
          <span class="mascot-shadow"></span>
        </div>
        <div class="speech-bubble">어디부터 막혔어?<br><strong>같이 찾아보자!</strong><span aria-hidden="true">✦</span></div>
      </div>
    </main>

    <footer class="home-footer">
      <span>AHA MATH</span>
      <span>작은 이해가 쌓여, 큰 자신감으로.</span>
    </footer>
  </body>
</html>
